# P3 Linux: keep the default config minimal so X.Org auto-detects the card
# (modesetting on KMS drivers, otherwise vesa / fbdev).
# To force a resolution or driver, uncomment and adjust:
#Section "Device"
#    Identifier "Card0"
#    Driver     "vesa"
#EndSection
#Section "Screen"
#    Identifier "Screen0"
#    Device     "Card0"
#    DefaultDepth 16
#    SubSection "Display"
#        Depth 16
#        Modes "800x600" "640x480"
#    EndSubSection
#EndSection
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
