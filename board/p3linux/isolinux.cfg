DEFAULT live
PROMPT 1
TIMEOUT 50
SAY
SAY  P3 Linux @VERSION@ - Linux for Pentium III
SAY  -----------------------------------------
SAY  live      : start P3 Linux desktop (default)
SAY  vga       : desktop, 16-colour-safe VGA text console / no framebuffer
SAY  depth8    : desktop in 256 colours (slow/old video cards, low RAM)
SAY  text      : text console only (no X)
SAY
LABEL live
  KERNEL /boot/bzImage
  APPEND initrd=/boot/initrd.gz @CMDLINE@
LABEL vga
  KERNEL /boot/bzImage
  APPEND initrd=/boot/initrd.gz console=tty0 console=ttyS0,115200 vga=normal nomodeset
LABEL depth8
  KERNEL /boot/bzImage
  APPEND initrd=/boot/initrd.gz @CMDLINE@ p3.depth=8
LABEL text
  KERNEL /boot/bzImage
  APPEND initrd=/boot/initrd.gz @CMDLINE@ nox
